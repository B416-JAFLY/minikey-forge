<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINI · 安全密钥验证</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#080c14;color:#e9f0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#1c3049 0,transparent 65%)}main{width:min(620px,92vw);padding:42px;border:1px solid #314153;border-radius:32px;background:#111b28cc;box-shadow:0 30px 100px #0006}.eyebrow{font-size:12px;letter-spacing:3px;color:#9bb0c9}h1{font-size:34px;margin:12px 0 10px}p{color:#b5c5da;line-height:1.8}.symbol{display:grid;place-items:center;width:100px;height:100px;margin:28px auto;border:2px solid #465a73;border-radius:50%;font-size:42px;transition:.3s}.busy{border-top-color:#94dfff;animation:spin 1s linear infinite}.success{border-color:#83ecc0;color:#83ecc0;animation:pop .5s ease}.error{border-color:#ff9393;color:#ff9393}.actions{display:flex;gap:12px;flex-wrap:wrap}button{flex:1;min-width:180px;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:600;cursor:pointer;background:#c2e2ff;color:#102338}button.secondary{background:#263951;color:#e8f2ff}button:disabled{opacity:.4;cursor:default}#status{min-height:60px;text-align:center}small{display:block;margin-top:24px;color:#90a4bf;line-height:1.8}#counter{font-variant-numeric:tabular-nums;color:#a7c5e8}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.busy,.success{animation:none}}
</style>
<main><div class="eyebrow">MSU2 MINI / LOCAL PROTOTYPE</div><h1>一次触摸，完成确认。</h1><p>验证 MINI 的真实 WebAuthn 注册与登录。系统提示出现时选择「安全密钥」，再触摸板子的感应区域。</p><div id="symbol" class="symbol" aria-hidden="true">◇</div><p id="status" role="status" aria-live="polite">正在检查本地测试状态…</p><div class="actions"><button id="register" disabled>注册测试密钥</button><button id="login" class="secondary" disabled>触摸登录</button></div><p id="counter"></p><small>仅使用 localhost 测试账号。首次注册后，可普通拔插板子，再点「触摸登录」验证凭据保存。本页成功表示服务端验签通过。当前固件关闭板上显示；PIN 提示由系统提供。8766 端口的 passkey 测试要求驻留凭据与 PIN 用户验证，登录不预先提供凭据 ID。</small></main><script src="/app.js"></script></html>
